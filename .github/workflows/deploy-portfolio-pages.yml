# Builds visuxlize-portfolio and pushes the static site to the gh-pages branch.
#
# GitHub Pages setup (one time):
#   Repository → Settings → Pages → Build and deployment
#   Source: "Deploy from a branch"
#   Branch: gh-pages  /  folder: / (root)
#
# Do NOT set Source to "main" — that shows README instead of the app.

name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: visuxlize-portfolio/package-lock.json

      - name: Install and build
        working-directory: visuxlize-portfolio
        run: |
          npm ci
          npm run build

      - name: Disable Jekyll
        run: touch visuxlize-portfolio/build/.nojekyll

      - name: Push build to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: visuxlize-portfolio/build
          force_orphan: true
