# Builds visuxlize-portfolio and deploys to GitHub Pages (static React app).
# After merge, set: Repo Settings → Pages → Build and deployment → Source → GitHub Actions
# (not "Deploy from branch" on main, or the README will be shown instead of the app).

name: Deploy portfolio site

on:
  push:
    branches: ["main"]
    paths:
      - "visuxlize-portfolio/**"
      - ".github/workflows/deploy-portfolio-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: visuxlize-portfolio/package-lock.json

      - name: Install and build
        working-directory: visuxlize-portfolio
        run: |
          npm ci
          npm run build

      - name: Disable Jekyll (CRA needs this on Pages)
        run: touch visuxlize-portfolio/build/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: visuxlize-portfolio/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
