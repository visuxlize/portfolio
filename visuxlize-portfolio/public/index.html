<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        var theme = localStorage.getItem('theme');
        if (
          theme === 'dark' ||
          (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta
      name="description"
      content="Andres Marte - Software Development & UX/UI Design Portfolio. Cybersecurity student, React developer, and freelance designer."
    />
    <meta name="keywords" content="Andres Marte, Software Development, UX/UI Design, React, Cybersecurity, Portfolio" />
    <meta name="author" content="Andres Marte" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://visuxlize.github.io/portfolio/" />
    <meta property="og:title" content="Andres Marte - Portfolio" />
    <meta property="og:description" content="Software Development & UX/UI Design Portfolio" />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://visuxlize.github.io/portfolio/" />
    <meta property="twitter:title" content="Andres Marte - Portfolio" />
    <meta property="twitter:description" content="Software Development & UX/UI Design Portfolio" />
    <meta property="twitter:image" content="%PUBLIC_URL%/og-image.jpg" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <title>Andres Marte - Portfolio</title>

    <!-- Decode the path encoded by 404.html and restore it via history API
         so React Router sees the full route on a hard refresh / direct link. -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) { return s.replace(/~and~/g, '&'); });
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) +
              decoded[0] +
              (decoded.slice(1).join('&') ? '?' + decoded.slice(1).join('&') : '') +
              l.hash
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
